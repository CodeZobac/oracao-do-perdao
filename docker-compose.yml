services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracao-app
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3333"
    ports:
      - "3333:3333"
    user: "1000:1000"
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"